repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # keep in step with verison in pyproject.toml
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/rtts/djhtml
    rev: v1.4.9
    hooks:
      - id: djhtml
